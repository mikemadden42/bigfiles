name: CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }}${{ matrix.cxx && format(' ({0})', matrix.cxx) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, build_type: Release }
          - { os: ubuntu-latest, build_type: ASAN }
          - { os: ubuntu-latest, build_type: UBSAN }
          - { os: ubuntu-latest, build_type: Release, cxx: clang++ }
          # MSan reports false positives from the uninstrumented system
          # libstdc++, so this only checks that the MSAN build works.
          - { os: ubuntu-latest, build_type: MSAN, cxx: clang++, skip_tests: true }
          - { os: macos-latest, build_type: Release }
          - { os: macos-latest, build_type: ASAN }
          - { os: windows-latest, build_type: Release }
          - { os: windows-latest, build_type: ASAN }

    steps:
    - uses: actions/checkout@v5

    - name: Configure CMake
      # CMAKE_BUILD_TYPE is used by single-config generators; Visual Studio
      # picks the configuration at build time with --config.
      shell: bash
      run: >
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      # The smoke test needs bash, so Windows has no tests to run yet.
      if: ${{ !matrix.skip_tests }}
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure
